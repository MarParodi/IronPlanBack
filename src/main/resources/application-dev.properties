# =============================================================================
# Perfil Spring "dev" — seed de datos demo en MySQL local
# =============================================================================
#
# Activar:
#   mvn spring-boot:run -Dspring-boot.run.profiles=dev
#   IntelliJ: Run → Edit Configurations → Active profiles: dev
#
# Re-seed desde cero:
#   DROP DATABASE Ironplan; CREATE DATABASE Ironplan CHARACTER SET utf8mb4;
#   Reiniciar la app con perfil dev.
#
# Usuarios demo (contraseña común: Demo1234!)
#   admin@ironplan.local   — ADMIN
#   marina@ironplan.local  — USER principal (rutina activa, historial, org)
#   carlos@ironplan.local  — USER (org, competencias)
#   lucia@ironplan.local   — USER sin organización
#   pedro@ironplan.local   — USER (Grupo Mañana, métricas/retos)
#   sofia@ironplan.local   — USER (Grupo Tarde, métricas/retos)
#
# Métricas/leaderboards: al arrancar con dev se enriquecen user_activities y competencias
# (ver DevMetricsEnhancer). Si ya tenías BD, reinicia con perfil dev una vez.
#
# Invitación org: código KINE2026 (Carrera Kinesiología)
#
# Login API: POST /api/auth/login
#   Body: {"identifier":"marina@ironplan.local","password":"Demo1234!"}
# =============================================================================

spring.jpa.show-sql=false
logging.level.com.example.ironplan.config=INFO
