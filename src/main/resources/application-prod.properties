# ============================================
# IRONPLAN - Configuración de Producción
# ============================================
# Las variables ${...} serán inyectadas desde Railway

spring.application.name=IronPlan

# ============================================
# Base de datos MySQL (Railway)
# ============================================
# Railway provee las variables separadas
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=5000&socketTimeout=30000
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de conexiones (40 usuarios concurrentes)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=600000

# ============================================
# JPA / Hibernate
# ============================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false

# ============================================
# Seguridad JWT
# En Railway confirmar:
#   SPRING_PROFILES_ACTIVE=prod
#   JWT_SECRET estable (no cambiarlo en cada deploy)
#   JWT_EXPIRATION=24h  Y  JWT_EXPIRATION_MS=86400000 (ambas, alineadas)
#   CORS_ORIGINS = URL real del front (y dominio custom si hay), separadas por coma
#   Sleep/scale-to-zero desactivado, o ping a /api/health cada ~5 min
#   Memoria del servicio si hay OOM; revisar reinicios y latencia MySQL
# ============================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:24h}
app.jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}

# ============================================
# CORS - Orígenes permitidos
# ============================================
cors.allowed-origins=${CORS_ORIGINS:https://ironplanfront-production.up.railway.app}

# ============================================
# Servidor
# ============================================
server.port=${PORT:8080}

# Uploads (fotos de celular suelen superar el default de 1 MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
server.tomcat.max-swallow-size=15MB
server.tomcat.max-http-form-post-size=12MB

# ============================================
# Logging (menos verbose en producción)
# ============================================
logging.level.root=WARN
logging.level.com.example.ironplan=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
